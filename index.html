    <script>
        // SHIM: Fix for malformed postMessage calls (common in Spline/Firebase/Iframe environments)
        (function() {
            const wrap = (target) => {
                if (!target || !target.postMessage) return;
                const original = target.postMessage;
                target.postMessage = function(message, targetOrigin, transfer) {
                    // Fix 'https://' which is syntactically invalid as an origin
                    if (typeof targetOrigin === 'string' && targetOrigin.trim() === 'https://') {
                        targetOrigin = '*';
                    }
                    try {
                        return original.call(this, message, targetOrigin, transfer);
                    } catch (e) {
                        // Fallback for any other malformed origin errors
                        if (e.name === 'SyntaxError' || e.code === 12) {
                            return original.call(this, message, '*', transfer);
                        }
                        throw e;
                    }
                };
            };
            wrap(window);
            if (window.parent !== window) wrap(window.parent);
        })();
    </script>
